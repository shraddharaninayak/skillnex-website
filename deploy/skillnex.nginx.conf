server {
    listen 80;
    server_name _; # Replace with your domain name (e.g., example.com www.example.com) or leave as _ for VPS IP

    # Frontend React Build
    root /var/www/skillnex/dist;
    index index.html;

    # Handle client-side routing in React / React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy backend API calls to Express (Port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
